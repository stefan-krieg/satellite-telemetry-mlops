[project]
name = "satellite-telemetry-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Stefan Krieg", email = "stefan@sisters-gti.de" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.162.5",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "redis>=8.1.0",
    "scikit-learn>=1.7.2",
]

[project.scripts]
satellite-telemetry-mlops = "satellite_telemetry_mlops:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
train = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "mlflow>=3.18.0",
    "seaborn>=0.13.2",
]
